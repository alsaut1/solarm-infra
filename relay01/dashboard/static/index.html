<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>solane01 — приборы</title>
<style>
:root{
  --ground:#0C1519;
  --panel:#111F25;
  --panel-2:#0F1B21;
  --rule:#1D3640;
  --rule-soft:#16292F;
  --text:#CFE0E4;
  --dim:#6B8A94;
  --ok:#4FB8A8;
  --warn:#E0A038;
  --crit:#DD5B4E;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--text);
  font-family:var(--mono);
  font-size:13px;
  line-height:1.45;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}

.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 56px}

/* ---------- шапка ---------- */
.top{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1px solid var(--rule);
}
.host{
  font-size:19px;font-weight:700;letter-spacing:-.02em;
}
.host .ip{color:var(--dim);font-weight:400;font-size:13px;margin-left:8px}
.pill{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 9px;border:1px solid currentColor;border-radius:2px;
}
.pill.ok{color:var(--ok)}
.pill.warn{color:var(--warn)}
.pill.crit{color:var(--crit)}
.stamp{margin-left:auto;color:var(--dim);font-size:12px}

/* ---------- бюджет слота: главный прибор ---------- */
.budget{
  margin:22px 0 26px;
  padding:18px 20px 14px;
  background:var(--panel);
  border:1px solid var(--rule);
  border-radius:3px;
}
.budget-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.budget-label{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
}
.budget-val{
  margin-left:auto;font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1;
}
.budget-unit{font-size:14px;color:var(--dim);font-weight:400;margin-left:4px}

.track{position:relative;height:34px;background:var(--panel-2);border:1px solid var(--rule-soft);border-radius:2px;overflow:hidden}
.track-danger{
  position:absolute;top:0;bottom:0;left:87.5%;right:0;
  background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(221,91,78,.16) 5px 10px);
  border-left:1px solid rgba(221,91,78,.5);
}
.track-fill{
  position:absolute;top:0;bottom:0;left:0;width:0;
  background:linear-gradient(90deg,rgba(79,184,168,.22),rgba(79,184,168,.55));
  border-right:2px solid var(--ok);
  transition:width .45s cubic-bezier(.2,.7,.3,1),border-color .45s,background .45s;
}
.track-fill.warn{background:linear-gradient(90deg,rgba(224,160,56,.2),rgba(224,160,56,.55));border-right-color:var(--warn)}
.track-fill.crit{background:linear-gradient(90deg,rgba(221,91,78,.2),rgba(221,91,78,.6));border-right-color:var(--crit)}
.ticks{display:flex;margin-top:6px;color:var(--dim);font-size:10px;letter-spacing:.06em}
.ticks span{flex:1}
.ticks span:last-child{flex:0;white-space:nowrap}
.budget-note{margin-top:9px;color:var(--dim);font-size:11.5px}

/* ---------- ячейки ---------- */
.cells{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.cell{background:var(--panel);padding:12px 13px 11px}
.cell-k{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.cell-v{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.cell-v .u{font-size:12px;font-weight:400;color:var(--dim);margin-left:3px}
.cell-s{font-size:11px;color:var(--dim);margin-top:3px;min-height:16px}
.v-ok{color:var(--text)}
.v-warn{color:var(--warn)}
.v-crit{color:var(--crit)}

/* ---------- диапазон ---------- */
.range{display:flex;gap:6px;margin:26px 0 12px;align-items:center}
.range-label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-right:4px}
.rbtn{
  font-family:var(--mono);font-size:12px;color:var(--dim);
  background:transparent;border:1px solid var(--rule);border-radius:2px;
  padding:4px 12px;cursor:pointer;
}
.rbtn:hover{color:var(--text);border-color:var(--dim)}
.rbtn:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.rbtn[aria-pressed="true"]{color:var(--ground);background:var(--text);border-color:var(--text)}

/* ---------- графики ---------- */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:12px 14px 8px}
.chart-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.chart-t{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.chart-now{margin-left:auto;font-size:14px;font-weight:700}
.chart-hint{font-size:11px;color:var(--dim);height:15px;margin-top:2px}
canvas{display:block;width:100%;height:104px}

.empty{padding:40px 0;color:var(--dim);text-align:center}

@media (max-width:900px){
  .cells{grid-template-columns:repeat(3,1fr)}
  .charts{grid-template-columns:1fr}
  .budget-val{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  .track-fill{transition:none}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="host">solane01<span class="ip">5.43.224.31</span></div>
    <div class="pill ok" id="pill">загрузка</div>
    <div class="stamp" id="stamp">—</div>
  </div>

  <!-- главный прибор: сколько из 400 мс съедает проигрывание слота -->
  <section class="budget">
    <div class="budget-head">
      <div class="budget-label">Проигрывание слота</div>
      <div class="budget-val"><span id="replayNow">—</span><span class="budget-unit">мс из 400</span></div>
    </div>
    <div class="track">
      <div class="track-danger"></div>
      <div class="track-fill" id="trackFill"></div>
    </div>
    <div class="ticks"><span>0</span><span>100</span><span>200</span><span>300</span><span>350</span></div>
    <div class="budget-note" id="budgetNote">—</div>
  </section>

  <div class="cells">
    <div class="cell"><div class="cell-k">Отставание</div><div class="cell-v" id="lagV">—</div><div class="cell-s" id="lagS"></div></div>
    <div class="cell"><div class="cell-k">Финализация</div><div class="cell-v" id="finV">—</div><div class="cell-s">норма 31</div></div>
    <div class="cell"><div class="cell-k">Память</div><div class="cell-v" id="memV">—</div><div class="cell-s" id="memS"></div></div>
    <div class="cell"><div class="cell-k">RPC 8899</div><div class="cell-v" id="rpcV">—</div><div class="cell-s" id="rpcS"></div></div>
    <div class="cell"><div class="cell-k">gRPC 10000</div><div class="cell-v" id="grpcV">—</div><div class="cell-s">свои клиенты</div></div>
    <div class="cell"><div class="cell-k">Очередь 8900</div><div class="cell-v" id="sqV">—</div><div class="cell-s" id="sqS"></div></div>
  </div>

  <div class="range">
    <span class="range-label">Окно</span>
    <button class="rbtn" data-limit="240"  data-every="1" aria-pressed="true">1 час</button>
    <button class="rbtn" data-limit="360"  data-every="4" aria-pressed="false">6 часов</button>
    <button class="rbtn" data-limit="720"  data-every="8" aria-pressed="false">24 часа</button>
  </div>

  <div class="charts" id="charts">
    <div class="chart">
      <div class="chart-head"><span class="chart-t">Отставание, слотов</span><span class="chart-now" id="n-lag">—</span></div>
      <canvas id="c-lag"></canvas><div class="chart-hint" id="h-lag"></div>
    </div>
    <div class="chart">
      <div class="chart-head"><span class="chart-t">Проигрывание, мс</span><span class="chart-now" id="n-replay">—</span></div>
      <canvas id="c-replay"></canvas><div class="chart-hint" id="h-replay"></div>
    </div>
    <div class="chart">
      <div class="chart-head"><span class="chart-t">Память, ГБ</span><span class="chart-now" id="n-mem">—</span></div>
      <canvas id="c-mem"></canvas><div class="chart-hint" id="h-mem"></div>
    </div>
    <div class="chart">
      <div class="chart-head"><span class="chart-t">Соединения 8899</span><span class="chart-now" id="n-rpc">—</span></div>
      <canvas id="c-rpc"></canvas><div class="chart-hint" id="h-rpc"></div>
    </div>
    <div class="chart">
      <div class="chart-head"><span class="chart-t">Очередь подписчиков, МБ</span><span class="chart-now" id="n-sq">—</span></div>
      <canvas id="c-sq"></canvas><div class="chart-hint" id="h-sq"></div>
    </div>
    <div class="chart">
      <div class="chart-head"><span class="chart-t">CPU geyser, %</span><span class="chart-now" id="n-cpu">—</span></div>
      <canvas id="c-cpu"></canvas><div class="chart-hint" id="h-cpu"></div>
    </div>
  </div>

</div>

<script>
const CSS = getComputedStyle(document.documentElement);
const C = {
  ok:   CSS.getPropertyValue('--ok').trim(),
  warn: CSS.getPropertyValue('--warn').trim(),
  crit: CSS.getPropertyValue('--crit').trim(),
  dim:  CSS.getPropertyValue('--dim').trim(),
  rule: CSS.getPropertyValue('--rule-soft').trim(),
  text: CSS.getPropertyValue('--text').trim(),
};

// пороги: [жёлтый, красный]
const LIM = {
  replay: [300, 350],   // мс из 400
  lag:    [50, 300],    // слотов
  fin:    [60, 150],    // слотов
  mem:    [400, 460],   // ГБ из 503
  sq:     [5, 20],      // МБ
  rpc:    [120, 200],   // соединений
};

const level = (v, [w, c]) => v >= c ? 'crit' : v >= w ? 'warn' : 'ok';
const cls   = l => l === 'crit' ? 'v-crit' : l === 'warn' ? 'v-warn' : 'v-ok';
const col   = l => l === 'crit' ? C.crit : l === 'warn' ? C.warn : C.ok;
const worst = ls => ls.includes('crit') ? 'crit' : ls.includes('warn') ? 'warn' : 'ok';

let state = { limit: 240, every: 1, data: [] };
const charts = {};

function fmt(n, d = 0) {
  return Number(n).toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d });
}

/* ---------- рисование ---------- */
function draw(key, values, stamps, color, opts = {}) {
  const cv = document.getElementById('c-' + key);
  if (!cv || !values.length) return;

  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const pad = { t: 8, r: 2, b: 4, l: 2 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;

  let lo = Math.min(...values), hi = Math.max(...values);
  if (opts.floor0) lo = 0;
  if (hi === lo) hi = lo + 1;
  const span = hi - lo;
  lo -= span * 0.08; hi += span * 0.08;

  const X = i => pad.l + (values.length === 1 ? iw / 2 : (i / (values.length - 1)) * iw);
  const Y = v => pad.t + ih - ((v - lo) / (hi - lo)) * ih;

  // сетка
  g.strokeStyle = C.rule; g.lineWidth = 1;
  for (let k = 0; k <= 2; k++) {
    const y = Math.round(pad.t + (ih / 2) * k) + .5;
    g.beginPath(); g.moveTo(pad.l, y); g.lineTo(w - pad.r, y); g.stroke();
  }

  // порог
  if (opts.limit != null && opts.limit <= hi && opts.limit >= lo) {
    g.strokeStyle = 'rgba(221,91,78,.45)'; g.setLineDash([3, 3]);
    const y = Math.round(Y(opts.limit)) + .5;
    g.beginPath(); g.moveTo(pad.l, y); g.lineTo(w - pad.r, y); g.stroke();
    g.setLineDash([]);
  }

  // заливка
  const grad = g.createLinearGradient(0, pad.t, 0, h);
  grad.addColorStop(0, color + '38');
  grad.addColorStop(1, color + '05');
  g.beginPath(); g.moveTo(X(0), Y(values[0]));
  values.forEach((v, i) => g.lineTo(X(i), Y(v)));
  g.lineTo(X(values.length - 1), h); g.lineTo(X(0), h); g.closePath();
  g.fillStyle = grad; g.fill();

  // линия
  g.beginPath(); g.moveTo(X(0), Y(values[0]));
  values.forEach((v, i) => g.lineTo(X(i), Y(v)));
  g.strokeStyle = color; g.lineWidth = 1.5; g.lineJoin = 'round'; g.stroke();

  // последняя точка
  g.beginPath(); g.arc(X(values.length - 1), Y(values[values.length - 1]), 2.5, 0, 7);
  g.fillStyle = color; g.fill();

  charts[key] = { values, stamps, X, Y, color, w, h, pad, opts };
}

function hover(key, ev) {
  const c = charts[key];
  if (!c) return;
  const cv = document.getElementById('c-' + key);
  const rect = cv.getBoundingClientRect();
  const x = ev.clientX - rect.left;
  let idx = Math.round(((x - c.pad.l) / (c.w - c.pad.l - c.pad.r)) * (c.values.length - 1));
  idx = Math.max(0, Math.min(c.values.length - 1, idx));
  const hint = document.getElementById('h-' + key);
  const d = c.opts.dec || 0;
  hint.textContent = (c.stamps[idx] || '').slice(11) + '   ' + fmt(c.values[idx], d) + (c.opts.unit || '');
}

['lag', 'replay', 'mem', 'rpc', 'sq', 'cpu'].forEach(k => {
  const cv = document.getElementById('c-' + k);
  cv.addEventListener('mousemove', e => hover(k, e));
  cv.addEventListener('mouseleave', () => { document.getElementById('h-' + k).textContent = ''; });
});

/* ---------- отрисовка состояния ---------- */
function render() {
  const d = state.data;
  if (!d.length) {
    document.getElementById('stamp').textContent = 'нет данных за это окно';
    return;
  }
  const last = d[d.length - 1];
  const stamps = d.map(p => p.ts);

  const replayMs = d.map(p => p.replay_us / 1000);
  const memGb    = d.map(p => p.rss_kb / 1048576);
  const sqMb     = d.map(p => p.pubsub_sendq / 1048576);
  const lag      = d.map(p => p.lag);
  const rpc      = d.map(p => p.rpc_conns);
  const cpu      = d.map(p => p.cpu_pct);

  const nowReplay = replayMs[replayMs.length - 1];
  const nowMem    = memGb[memGb.length - 1];
  const nowSq     = sqMb[sqMb.length - 1];

  const lReplay = level(nowReplay, LIM.replay);
  const lLag    = level(last.lag, LIM.lag);
  const lFin    = level(last.fin, LIM.fin);
  const lMem    = level(nowMem, LIM.mem);
  const lSq     = level(nowSq, LIM.sq);
  const lRpc    = level(last.rpc_conns, LIM.rpc);

  // шапка
  const overall = worst([lReplay, lLag, lFin, lMem]);
  const pill = document.getElementById('pill');
  pill.className = 'pill ' + overall;
  pill.textContent = overall === 'ok' ? 'в норме' : overall === 'warn' ? 'под нагрузкой' : 'опасно';
  document.getElementById('stamp').textContent = 'снято ' + last.ts + ' UTC · точек ' + d.length;

  // бюджет слота
  document.getElementById('replayNow').textContent = fmt(nowReplay);
  const fill = document.getElementById('trackFill');
  fill.style.width = Math.min(100, (nowReplay / 400) * 100) + '%';
  fill.className = 'track-fill' + (lReplay === 'ok' ? '' : ' ' + lReplay);
  const free = 400 - nowReplay;
  document.getElementById('budgetNote').textContent = free > 0
    ? 'запас ' + fmt(free) + ' мс на слот — этим нода догоняет сеть'
    : 'запаса нет: слот считается дольше, чем сеть его выпускает';

  // ячейки
  const set = (id, val, unit, lvl, sub) => {
    const e = document.getElementById(id + 'V');
    e.className = 'cell-v ' + cls(lvl);
    e.innerHTML = val + (unit ? '<span class="u">' + unit + '</span>' : '');
    if (sub != null) document.getElementById(id + 'S').textContent = sub;
  };
  set('lag',  fmt(last.lag), 'слотов', lLag, last.lag < 50 ? 'на голове цепочки' : 'не успевает за сетью');
  set('fin',  fmt(last.fin), 'слотов', lFin, null);
  set('mem',  fmt(nowMem, 1), 'ГБ', lMem, 'из 503 доступных');
  set('rpc',  fmt(last.rpc_conns), '', lRpc, 'чужие боты');
  set('grpc', fmt(last.conns), '', 'ok', null);
  set('sq',   fmt(nowSq, 1), 'МБ', lSq, last.pubsub_conns + ' подписчик(ов)');

  // текущие значения над графиками
  const now = (id, v, lvl) => {
    const e = document.getElementById('n-' + id);
    e.textContent = v; e.className = 'chart-now ' + cls(lvl);
  };
  now('lag', fmt(last.lag), lLag);
  now('replay', fmt(nowReplay), lReplay);
  now('mem', fmt(nowMem, 1), lMem);
  now('rpc', fmt(last.rpc_conns), lRpc);
  now('sq', fmt(nowSq, 1), lSq);
  now('cpu', fmt(cpu[cpu.length - 1], 1), 'ok');

  draw('lag',    lag,      stamps, col(lLag),    { floor0: true, limit: LIM.lag[0], unit: ' сл.' });
  draw('replay', replayMs, stamps, col(lReplay), { floor0: true, limit: 350, unit: ' мс' });
  draw('mem',    memGb,    stamps, col(lMem),    { limit: LIM.mem[1], unit: ' ГБ', dec: 1 });
  draw('rpc',    rpc,      stamps, col(lRpc),    { floor0: true, unit: '' });
  draw('sq',     sqMb,     stamps, col(lSq),     { floor0: true, limit: LIM.sq[1], unit: ' МБ', dec: 1 });
  draw('cpu',    cpu,      stamps, C.dim,        { floor0: true, unit: ' %', dec: 1 });
}

async function load() {
  try {
    const r = await fetch('/api/metrics?limit=' + state.limit + '&every=' + state.every);
    state.data = await r.json();
    render();
  } catch (e) {
    document.getElementById('stamp').textContent = 'дашборд не читает CSV';
  }
}

document.querySelectorAll('.rbtn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.rbtn').forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    state.limit = +b.dataset.limit;
    state.every = +b.dataset.every;
    load();
  });
});

window.addEventListener('resize', () => { if (state.data.length) render(); });

load();
setInterval(load, 15000);
</script>
</body>
</html>
